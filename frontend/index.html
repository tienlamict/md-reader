<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>MD Reader</title>
</head>
<body>
<div class="app" id="app">
    <aside class="sidebar pane" id="sidebar" aria-label="Cây thư mục">
        <header class="pane-header">
            <span class="pane-title" id="folder-name">Thư mục</span>
            <span class="pane-actions">
                <button class="icon-btn" id="folder-open" type="button" title="Mở thư mục (Ctrl+Shift+O)"></button>
                <button class="icon-btn" id="folder-refresh" type="button" title="Làm mới"></button>
            </span>
        </header>
        <div class="tree" id="tree" hidden></div>
        <div class="pane-empty" id="tree-empty">
            <p class="pane-note">Chưa mở thư mục nào.</p>
            <button class="btn btn-sm" id="tree-open" type="button">Mở thư mục…</button>
        </div>
    </aside>

    <div class="main">
        <div class="tabstrip" id="tabstrip" hidden>
            <nav class="tabbar" id="tabbar" role="tablist" aria-label="Các file đang mở"></nav>
            <div class="mode-switch" id="mode-switch" role="group" aria-label="Chế độ hiển thị">
                <button type="button" data-mode="view" title="Xem (Ctrl+1)" aria-label="Xem"></button>
                <button type="button" data-mode="edit" title="Sửa (Ctrl+2)" aria-label="Sửa"></button>
                <button type="button" data-mode="split" title="Chia đôi: sửa + xem (Ctrl+3)" aria-label="Chia đôi"></button>
            </div>
        </div>
        <div class="body">
            <div class="workspace" id="workspace" data-mode="view">
                <div class="conflict-bar" id="conflict-bar" role="alert" hidden>
                    <span>File đã bị thay đổi bên ngoài app trong lúc bạn đang sửa.</span>
                    <button class="btn btn-sm" data-act="reload" type="button">Tải bản trên đĩa (bỏ thay đổi của bạn)</button>
                    <button class="btn btn-sm" data-act="keep" type="button">Giữ bản của tôi</button>
                </div>
                <section class="editor-pane" id="editor-pane" aria-label="Trình soạn thảo">
                    <div class="editor-host" id="editor-host"></div>
                    <div class="editor-status" id="editor-status"></div>
                </section>
                <div class="content" id="content">
                    <section class="welcome" id="welcome">
                        <h1>MD Reader</h1>
                        <p>Xem và sửa file Markdown giống như trên GitHub.</p>
                        <div class="welcome-actions">
                            <button class="btn" id="open-btn" type="button">Mở file…</button>
                            <button class="btn" id="open-folder-btn" type="button">Mở thư mục…</button>
                            <button class="btn" id="new-btn" type="button">File mới</button>
                        </div>
                        <p class="hint">Hoặc kéo thả file .md / thư mục vào cửa sổ.</p>
                        <div class="recent" id="recent" hidden>
                            <h2>Mở gần đây</h2>
                            <ul id="recent-list"></ul>
                        </div>
                    </section>
                    <article class="markdown-body" id="doc" hidden></article>
                </div>
            </div>
            <aside class="toc pane" id="toc" aria-label="Mục lục">
                <header class="pane-header"><span class="pane-title">Mục lục</span></header>
                <nav class="toc-list" id="toc-list"></nav>
            </aside>
            <div class="findbar" id="findbar" hidden></div>
        </div>
    </div>
</div>
<div class="toast" hidden id="toast"></div>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
